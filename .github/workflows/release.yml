# 修改记录:
#   2026-10-04  Claude  新建: 三平台测试 + 构建 wheel + 安装冒烟测试; 推送 v* 标签时发布 Release
#
# 普通推送 / PR: 只跑 test + build, 不发布
# 推送标签 vX.Y.Z: 额外校验标签与 pyproject.toml 版本号一致, 通过后创建 GitHub Release 并上传安装包
name: build-release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install ".[test]"
      - name: 单元测试与 DB 测试(不触网)
        run: python -m pytest -m "not integration" -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 pyproject.toml 版本 ${ver} 不一致" >&2
            exit 1
          fi
      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install build
          python -m build
          python -m zipfile -l dist/*.whl
      - name: 冒烟测试(在仓库外安装 wheel 并运行命令)
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export SPRING_HOME="$RUNNER_TEMP/spring_home"
          spring-init
          spring-describe-cli --list
          spring-init-db
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
