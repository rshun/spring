# 修改记录:
#   2026-10-04  Claude  新建: 安装包(wheel)部署配置, 每个 ETL / 工具注册一个 spring-* 命令
#   2026-10-04  Claude  package-data 收入 config/config.yaml.example(spring-init 的占位符模板)
#
# 构建: python -m build  (产出 dist/*.whl, 纯 Python, Windows / Linux / macOS 通用)
# 安装: pipx install dist/spring_quant-<版本>-py3-none-any.whl
# 首次: spring-init      (初始化运行目录 SPRING_HOME, 见 util/paths.py)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-quant"
version = "0.1.0"
description = "A 股行情、复权因子与基础数据 ETL(DuckDB)"
readme = "README.md"
# numpy 2.4 起要求 Python 3.11+
requires-python = ">=3.11"
# 与 requirements.txt 保持一致; lightgbm / scikit-learn / joblib 代码中未使用, 不列入
dependencies = [
    "duckdb==1.4.3",
    "numpy==2.4.0",
    "pandas==2.3.3",
    "akshare",
    "baostock",
    "pytdx==1.72",
    "pyyaml==6.0.3",
    "xlrd>=2.0.1",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

# 命令名 = spring- + 程序名(下划线换成连字符); python -m etl.<程序名> 的写法照常可用
[project.scripts]
spring-init              = "tools.init_home:main"
spring-init-db           = "etl.init_db:create_database_schema"
spring-trade-cal         = "etl.trade_cal:main"
spring-sync-basic        = "etl.sync_basic:main"
spring-sync-capital      = "etl.sync_capital:main"
spring-import-daily      = "etl.import_daily:main"
spring-fetch-index       = "etl.fetch_index:main"
spring-adjust            = "etl.adjust:main"
spring-fill-volratio     = "etl.fill_volratio:main"
spring-update-limit      = "etl.update_limit:main"
spring-fill-shares       = "etl.fill_shares:main"
spring-fill-turnover     = "etl.fill_turnover:main"
spring-sync-industry     = "etl.sync_industry:main"
spring-sync-margin       = "etl.sync_margin:main"
spring-sync-finance      = "etl.sync_finance:main"
spring-sync-suspension   = "etl.sync_suspension:main"
spring-sync-limit-pool   = "etl.sync_limit_pool:main"
spring-sync-xdr-ths      = "etl.sync_xdr_ths:main"
spring-check-daily       = "tools.check_daily:main"
spring-check-adjust      = "tools.check_adjust:main"
spring-describe-cli      = "tools.describe_cli:main"
spring-export-etl-tables = "tools.export_etl_tables:main"
spring-import-etl-tables = "tools.import_etl_tables:main"

# 包目录没有 __init__.py(.gitignore 忽略), 按命名空间包收集;
# sql / data / config 是随包分发的只读资源(见 util/paths.py 的 PACKAGE_ROOT)
[tool.setuptools.packages.find]
where = ["."]
include = [
    "etl", "etl.*",
    "tools", "tools.*",
    "util", "util.*",
    "datasource", "datasource.*",
    "sql", "data", "config",
]
exclude = ["*__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
sql = ["*.sql"]
data = ["*.csv"]
config = ["*.yaml", "*.yaml.example"]
